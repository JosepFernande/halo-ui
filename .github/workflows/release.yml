name: Release

on:
  push:
    branches: [main]
    paths:
      # Only run when the push can change a release outcome. A docs-only
      # merge would otherwise burn a full npm ci + build + audit for nothing.
      # The version-packages PR merge touches libs/*/package.json and
      # libs/*/CHANGELOG.md, so libs/** must stay covered — the "Check for
      # changesets" step remains the single source of truth for whether this
      # run actually publishes.
      - 'libs/**'
      - '.changeset/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Normal runs take 3-5 min; 30 min covers worst case without letting a
    # hung npm ci/publish block the release-main concurrency for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          # Needed before anything creates an annotated tag (`git tag -m`)
          # in this job — the publish loop below tags each package manually
          # and the release tag step does too. Without it, `git tag -m` fails
          # with "Committer identity unknown" (exit 128) and the tags just
          # never get created.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: npm ci
        env:
          HUSKY: '0'
      # Workaround temporal (ver issue #146): package-lock.json solo retiene
      # metadata resuelta de binarios nativos optionalDependency para la
      # plataforma que corrió npm install por última vez (Windows), así que
      # npm ci en Linux no puede resolver lightningcss-linux-x64-gnu ni
      # @tailwindcss/oxide-linux-x64-gnu (dependencia nativa de
      # @tailwindcss/postcss, usada por el pipeline de Angular/PostCSS al
      # compilar). A diferencia de esbuild, ninguno de los dos tiene un
      # postinstall de fallback que los descargue solo. Ambos se instalan en
      # UN SOLO `npm install` (no dos comandos separados): cada invocación de
      # npm install hace su propia poda de paquetes "extraneous" sobre todo
      # node_modules, y como estos binarios no se guardan en el lockfile
      # (--no-save, a propósito), un segundo `npm install` independiente
      # borraba el binario que el primero acababa de agregar.
      - name: Fix missing lightningcss/@tailwindcss-oxide native binaries on Linux CI
        run: |
          LC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss'].version")
          OXIDE_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save --no-audit --no-fund "lightningcss@${LC_VERSION}" "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VERSION}"

      - name: Build
        # Single publishable project post-consolidation (SDD change
        # consolidate-halo-ui-single-package): only halo-ui needs a
        # production build for a release; run-many -t build would also
        # rebuild showcase, which has no release outcome.
        run: npx nx build halo-ui --configuration=production

      - name: Check for changesets
        id: changesets
        run: |
          # In prerelease mode (.changeset/pre.json present with mode "pre"),
          # `changeset version` intentionally never deletes consumed .md files,
          # so a plain `ls` always finds them. A changeset only counts as
          # pending if it isn't yet listed in pre.json's `changesets` array
          # (which mirrors the last `version` run).
          #
          # Once pre.json is in mode "exit" (`changeset pre exit` already ran),
          # that array-diff no longer applies: the next `version` run isn't
          # another prerelease bump, it's the final consolidation that deletes
          # pre.json and cuts a stable release. Any leftover .md file must
          # count as pending regardless of the array, or this step reports
          # has_changesets=false forever and the exit never completes.
          md_ids=$(ls .changeset/*.md 2>/dev/null | xargs -n1 basename 2>/dev/null | sed 's/\.md$//' | grep -vx 'README' || true)

          if [ -f .changeset/pre.json ] && [ "$(jq -r '.mode' .changeset/pre.json)" = "pre" ]; then
            pending=$(comm -23 <(echo "$md_ids" | sed '/^$/d' | sort -u) <(jq -r '.changesets[]' .changeset/pre.json | sort -u))
          else
            pending="$md_ids"
          fi

          if [ -n "$pending" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: npx changeset version

      - name: Create Release Pull Request
        id: cpr
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages'
          body: |
            This PR was auto-generated by the release workflow.

            It contains version bumps and CHANGELOG updates from pending changesets.

            **Do not squash or rebase this PR — merge it as-is.**

            Once merged, the release workflow will publish the new versions to npm automatically.
          branch: release/version-packages
          branch-suffix: short-commit-hash
          base: main

      - name: Auto-merge version packages PR
        if: steps.changesets.outputs.has_changesets == 'true'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Audit production dependencies
        if: steps.changesets.outputs.has_changesets == 'false'
        # Non-blocking by design: an advisory unrelated to the change being
        # published must not kill the release. The exit code is recorded as a
        # failed step (visible in the run) but never blocks the publish — the
        # report is uploaded as an artifact so the finding stays actionable.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical --json > /tmp/npm-audit-report.json

      - name: Upload npm audit report
        if: steps.changesets.outputs.has_changesets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: /tmp/npm-audit-report.json
          if-no-files-found: ignore

      - name: Validate packages before publish
        if: steps.changesets.outputs.has_changesets == 'false'
        # Issue #78: fail the release (never silently PASS) if a publishable
        # package's dist/libs/<lib>/package.json lost its main/exports["."]/
        # typings entry points, or if this workflow stopped publishing from
        # dist/$lib_dir (the #85 source-publish regression). Validates the
        # output of the "Build" step above; blocks "Publish to npm from dist".
        run: npm run validate:packages

      - name: Publish to npm from dist
        id: publish
        if: steps.changesets.outputs.has_changesets == 'false'
        run: |
          # Publish the real build output: the installable package (fesm
          # bundles + per-entry-point .d.ts + a generated package.json with
          # a proper `exports` map) only exists under dist/libs/halo-ui,
          # produced by the "Build" step above. Publishing libs/halo-ui
          # (source) directly would ship a package with no
          # main/module/exports/typings (the #85 regression). Post-
          # consolidation (SDD change consolidate-halo-ui-single-package)
          # there is exactly one publishable package, so this is a single
          # straight-line step — no dependency-ordered loop needed anymore.
          # libs/halo-ui/package.json is used purely as the source of truth
          # for name + version, already bumped by the prior
          # `changeset version` run.
          #
          # No --tag is passed: npm tags a first publish `latest` by
          # default. The "Point the alpha dist-tag" step below moves `alpha`
          # forward afterward, only relevant if the repo re-enters
          # changesets prerelease mode.
          : > /tmp/newly_published.txt
          name="$(node -p "require('./libs/halo-ui/package.json').name")"
          version="$(node -p "require('./libs/halo-ui/package.json').version")"

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "skip: ${name}@${version} already on npm"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish "dist/libs/halo-ui" --access public

            echo "${name}@${version}" >> /tmp/newly_published.txt
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Point the alpha dist-tag at what just published
        if: steps.publish.outputs.published == 'true' && hashFiles('.changeset/pre.json') != ''
        run: |
          # The publish step above records the newly published
          # <name>@<version> in /tmp/newly_published.txt (one line, single
          # package post-consolidation). If a first publish under prerelease
          # mode happens, npm tags it `latest` by default and `alpha` would
          # go stale. This step reads that line and explicitly moves the
          # prerelease dist-tag (alpha, from .changeset/pre.json) forward.
          # Only relevant if the repo re-enters changesets prerelease mode.
          alpha_tag="$(jq -r '.tag' .changeset/pre.json)"
          while IFS= read -r pkg_tag; do
            [ -n "$pkg_tag" ] || continue
            echo "npm dist-tag add \"$pkg_tag\" \"$alpha_tag\""
            npm dist-tag add "$pkg_tag" "$alpha_tag"
          done < /tmp/newly_published.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release tag
        if: steps.publish.outputs.published == 'true'
        run: |
          # The run-level tag is versioned instead of stamped with date+sha
          # (issue #92), so the GitHub Release identifies the published semver
          # at a glance. Single publishable package post-consolidation, so the
          # version is read directly — no multi-package dedup needed anymore.
          # This is now the only git tag the release creates: the publish
          # step stopped also tagging <name>@<version>, since it duplicated
          # this tag on the same commit/version with no consumer reading it
          # back (npm view is what gates re-publishing, not the tag).
          name="$(node -p "require('./libs/halo-ui/package.json').name")"
          version="$(node -p "require('./libs/halo-ui/package.json').version")"
          if [ -z "$version" ]; then
            echo "::error::could not derive the published version from libs/halo-ui/package.json"
            exit 1
          fi

          TAG="release-v${version}"
          git tag -a "$TAG" -m "Release ${version}"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          # Stable releases surface as Latest; a release is marked prerelease
          # only in the exceptional case where the repo is back in changesets
          # pre mode (.changeset/pre.json with mode "pre"). In that case the
          # version label already carries the alpha suffix, so tag and name
          # stay correct.
          if [ -f .changeset/pre.json ] && [ "$(jq -r '.mode' .changeset/pre.json)" = "pre" ]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

          # Build the release body: published packages + the matching latest
          # CHANGELOG entries. generate_release_notes in the next step
          # prepends this body to the auto-generated PR notes.
          {
            echo "## Published"
            while IFS= read -r pkg_tag; do
              [ -n "$pkg_tag" ] || continue
              echo "- \`${pkg_tag}\`"
            done < /tmp/newly_published.txt
            echo
            echo "## CHANGELOG"
            echo
          } > /tmp/release-body.md

          # Single publishable package post-consolidation: one CHANGELOG,
          # read directly instead of looping over libs/*/package.json.
          changelog="libs/halo-ui/CHANGELOG.md"
          if [ -f "$changelog" ] && grep -qx "${name}@${version}" /tmp/newly_published.txt; then
            echo "### ${name} ${version}" >> /tmp/release-body.md
            echo >> /tmp/release-body.md
            awk -v v="## ${version}" '
              $0 == v { found = 1; print; next }
              found && $0 ~ /^## / { exit }
              found { print }
            ' "$changelog" >> /tmp/release-body.md
            echo "- [Full CHANGELOG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${changelog})" >> /tmp/release-body.md
            echo >> /tmp/release-body.md
          fi

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        # v3: v2.6.2 is the final v2 release and runs on the deprecated Node 20
        # runtime. Behavior for body_path + generate_release_notes is unchanged
        # (body is prepended to the auto-generated notes).
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: halo-ui ${{ env.VERSION }}
          body_path: /tmp/release-body.md
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
