      - name: Fix missing lightningcss/@tailwindcss-oxide native binaries on Linux CI
        run: |
          LC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss'].version")
          OXIDE_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save --no-audit --no-fund "lightningcss@${LC_VERSION}" "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VERSION}"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx tsx tools/audit/index.ts
      - run: npx tsx tools/audit/bundle-check.ts
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: |
            tools/audit/report.json
            tools/audit/bundle-report.json

  gga-review:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pinneado a un release real de Gentleman-Programming/gentleman-guardian-angel
      # (verificado en git ls-remote --tags). Actualizar deliberadamente cuando
      # se quiera adoptar una versión nueva.
      GGA_REF: 'v2.10.1'
      # Bump manual cuando cambien los parches de abajo (parse_review_status o
      # la plantilla de pr_mode.sh) para invalidar la cache y forzar un clone +
      # re-parcheo; de lo contrario un cache-hit restaura el /tmp/gga ya
      # parcheado con la versión vieja y el fix nunca se aplica.
      GGA_PATCH_VERSION: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            reviewable:
              - '**/*.ts'
              - '**/*.js'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.html'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        env:
          HUSKY: '0'
      # Workaround temporal (ver issue #146): package-lock.json solo retiene
      # metadata resuelta de binarios nativos optionalDependency para la
      # plataforma que corrió npm install por última vez (Windows), así que
      # npm ci en Linux no puede resolver lightningcss-linux-x64-gnu ni
      # @tailwindcss/oxide-linux-x64-gnu (dependencia nativa de
      # @tailwindcss/postcss, usada por el pipeline de Angular/PostCSS al
      # compilar). A diferencia de esbuild, ninguno de los dos tiene un
      # postinstall de fallback que los descargue solo. Ambos se instalan en
      # UN SOLO `npm install` (no dos comandos separados): cada invocación de
      # npm install hace su propia poda de paquetes "extraneous" sobre todo
      # node_modules, y como estos binarios no se guardan en el lockfile
      # (--no-save, a propósito), un segundo `npm install` independiente
      # borraba el binario que el primero acababa de agregar.
      - name: Fix missing lightningcss/@tailwindcss-oxide native binaries on Linux CI
        run: |
          LC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/lightningcss'].version")
          OXIDE_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@tailwindcss/oxide'].version")
          npm install --no-save --no-audit --no-fund "lightningcss@${LC_VERSION}" "@tailwindcss/oxide-linux-x64-gnu@${OXIDE_VERSION}"
      - name: Restore gga/opencode cache
        id: gga-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/gga
            /usr/local/bin/opencode
          key: gga-${{ runner.os }}-${{ env.GGA_REF }}-${{ env.GGA_PATCH_VERSION }}
          restore-keys: |
            gga-${{ runner.os }}-${{ env.GGA_REF }}-
      - name: Install opencode
        if: steps.filter.outputs.reviewable == 'true' && steps.gga-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/opencode
      - name: Install gga
        if: steps.filter.outputs.reviewable == 'true' && steps.gga-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$GGA_REF" https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          # Upstream's parse_review_status() only scans the first N lines of the
          # provider output for a `STATUS: PASSED|FAILED` line. The opencode
          # agent emits a verbose tool-call transcript (skill loads, glob/read/
          # git-diff calls + the streamed diff content) BEFORE printing its final
          # verdict, so the real STATUS: line routinely lands past any fixed N
          # (we previously widened 30→200 and it still missed it on this PR).
          # Replace the function entirely so it scans the WHOLE output and keeps
          # the LAST matching STATUS: line. Last-wins (not first) protects against
          # the model echoing the "Begin with STATUS:" instruction back as part
          # of its reasoning. AMBIGUOUS semantics are preserved: if both PASSED
          # and FAILED appear, we still return AMBIGUOUS and fail.
          python3 - <<'PYEOF'
          import pathlib
          path = pathlib.Path("/tmp/gga/bin/gga")
          lines = path.read_text().splitlines(keepends=True)
          start = next(i for i, l in enumerate(lines) if l.startswith("parse_review_status() {"))
          # The function body ends at the first line that is exactly "}\n" after
          # the start index (closing brace at column 0).
          end = next(i for i in range(start + 1, len(lines)) if lines[i].rstrip("\n") == "}")
          new_fn = (
            "parse_review_status() {\n"
            "  local response=\"$1\"\n"
            "  # Second arg (max_lines) is accepted for backward compatibility with\n"
            "  # the upstream caller `parse_review_status \"$RESULT\" 30`, but we scan\n"
            "  # the WHOLE output: the opencode agent's transcript can push the real\n"
            "  # STATUS: line arbitrarily far down, so any fixed lookahead is wrong.\n"
            "  local last_status=\"\"\n"
            "  local line\n"
            "  while IFS= read -r line; do\n"
            "    line=$(printf '%s' \"$line\" | sed $'s/\\x1b\\[[0-9;]*[mK]//g')\n"
            "    line=\"${line#\"${line%%[![:space:]]*}\"}\"\n"
            "    line=\"${line%\"${line##*[![:space:]]}\"}\"\n"
            "    line=\"${line#\\*\\*}\"\n"
            "    line=\"${line%\\*\\*}\"\n"
            "    line=\"${line#\\*}\"\n"
            "    line=\"${line%\\*}\"\n"
            "    line=\"${line#\\`}\"\n"
            "    line=\"${line%\\`}\"\n"
            "    line=\"${line#\\# }\"\n"
            "    line=\"${line#> }\"\n"
            "    if [[ \"$line\" =~ ^STATUS:[[:space:]]*(PASSED|FAILED)([^[:alnum:]_].*)?$ ]]; then\n"
            "      local candidate=\"${BASH_REMATCH[1]}\"\n"
            "      if [[ -n \"$last_status\" && \"$last_status\" != \"$candidate\" ]]; then\n"
            "        echo \"AMBIGUOUS\"\n"
            "        return 1\n"
            "      fi\n"
            "      last_status=\"$candidate\"\n"
            "    fi\n"
            "  done <<< \"$response\"\n"
            "  if [[ -n \"$last_status\" ]]; then\n"
            "    echo \"$last_status\"\n"
            "    return 0\n"
            "  fi\n"
            "  echo \"AMBIGUOUS\"\n"
            "  return 1\n"
            "}\n"
          )
          lines[start:end + 1] = [new_fn]
          path.write_text("".join(lines))
          PYEOF
          # Upstream leaves response format/language unconstrained beyond the STATUS
          # line, so real PR comments come out inconsistently formatted and in
          # English. Enforce a fixed Spanish table-based template to match this
          # repo's requirement that PR/issue/commit-facing text be in Spanish.
          python3 - <<'PYEOF'
          import pathlib

          path = pathlib.Path("/tmp/gga/lib/pr_mode.sh")
          content = path.read_text()

          marker = "**Begin with STATUS:**"
          block = """**FORMATO DE RESPUESTA OBLIGATORIO (en español, sin excepciones):**

          Tu respuesta debe empezar exactamente con una de estas dos líneas, tal cual (es un marcador que un script parsea, no lo traduzcas ni lo omitas):
          STATUS: PASSED
          STATUS: FAILED

          Inmediatamente después de esa línea, responde siempre en español neutro/profesional, sin importar el idioma de este prompt. Usa exactamente esta estructura, sin desviarte:

          ### 🤖 Gentleman Guardian Angel — Revisión de PR

          **Resultado:** ✅ APROBADO  (o ❌ RECHAZADO)

          | Regla | Evidencia |
          |-------|-----------|
          | <nombre de la regla> | <evidencia concreta: qué se verificó y por qué cumple o no> |

          Si es ❌ RECHAZADO, agrega debajo de la tabla una lista de violaciones, una por línea, con: archivo, número de línea (si aplica), regla violada, y descripción del problema.

          Termina siempre con una de estas dos líneas exactas:
          **✅ REVISIÓN DE CÓDIGO APROBADA**
          **❌ REVISIÓN DE CÓDIGO RECHAZADA**

          """

          if block not in content:
              if marker not in content:
                  raise SystemExit(f"marker not found in {path}")
              content = content.replace(marker, block + marker, 1)
              path.write_text(content)
          PYEOF
      - name: Set up gga binary
        if: steps.filter.outputs.reviewable == 'true'
        run: |
          bash /tmp/gga/install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Ensure base branch is fetched locally
        if: steps.filter.outputs.reviewable == 'true'
        run: |
          git fetch --force origin "${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
          echo "--- diagnostic ---"
          git rev-parse --verify "${{ github.base_ref }}"
          git rev-parse HEAD
          git merge-base "${{ github.base_ref }}" HEAD
          git diff --name-only "${{ github.base_ref }}...HEAD"
      - name: Run gga PR review
        id: gga_review
        if: steps.filter.outputs.reviewable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          gga run --pr-mode --ci 2>&1 | tee /tmp/gga-review.log
          exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
      - name: Comment gga review on PR
        if: steps.filter.outputs.reviewable == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Strip ANSI color/cursor codes — GitHub markdown renders them as
          # garbled literal escape sequences instead of colors.
          sed -i 's/\x1b\[[0-9;]*[mK]//g' /tmp/gga-review.log

          # Everything from the STATUS: line onward is the model's own
          # Spanish-templated verdict (header + result + table, per #54) —
          # the setup banner and agent tool-call trace before it add no
          # value here; they're still visible in the Actions job log.
          awk '/^STATUS:/{p=1; next} p' /tmp/gga-review.log > /tmp/gga-verdict.md

          if [[ -s /tmp/gga-verdict.md ]]; then
            # Model produced its templated verdict — use it as-is, don't
            # prepend a second header or it duplicates the model's own.
            cp /tmp/gga-verdict.md /tmp/gga-comment.md
          elif grep -q "No matching files changed in PR" /tmp/gga-review.log; then
            # gga's own file-pattern filter (*.ts,*.js,*.css,*.scss,*.html)
            # found nothing to review — this is a legitimate skip, not a
            # failure, so it must not read as one in the PR comment.
            {
              echo "### 🤖 Gentleman Guardian Angel — Revisión de PR"
              echo ""
              echo "**Resultado:** ⚪ NO APLICA (sin archivos que coincidan con los patrones revisados por gga)"
            } > /tmp/gga-comment.md
          else
            # gga never reached STATUS: for any other reason (crash/timeout
            # before the model replied) — fall back to a minimal Spanish
            # banner so the PR still gets a comment instead of an empty one.
            {
              echo "### 🤖 Gentleman Guardian Angel — Revisión de PR"
              echo ""
              echo "**Resultado:** ❌ FALLÓ (exit code ${{ steps.gga_review.outputs.exit_code }}, sin veredicto — ver logs del job)"
            } > /tmp/gga-comment.md
          fi

          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/gga-comment.md

  validate-showcase-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm run validate:showcase-version

  summary:
    needs: [lint, stylelint, test, build, audit, gga-review, validate-showcase-version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.stylelint.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" || \
                "${{ needs.validate-showcase-version.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
