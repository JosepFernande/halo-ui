<h2 class="mb-6 text-2xl font-bold text-zinc-900">API Reference</h2>

<h3 class="mb-3 text-xs font-bold uppercase tracking-wider text-zinc-500">Inputs</h3>
<div class="mb-8 overflow-x-auto rounded-2xl border border-surface-border bg-white shadow-sm">
  <table class="w-full text-left text-sm">
    <thead
      class="border-b border-surface-border bg-surface-base text-[11px] font-bold uppercase tracking-wider text-zinc-500"
    >
      <tr>
        <th class="px-4 py-3">Input</th>
        <th class="px-4 py-3">Tipo</th>
        <th class="px-4 py-3">Default</th>
        <th class="px-4 py-3">Descripción</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-surface-border">
      @for (row of rows(); track row.name) {
        <tr>
          <td class="px-4 py-3 font-mono text-xs font-semibold text-brand-700">{{ row.name }}</td>
          <td class="px-4 py-3 font-mono text-xs text-zinc-600">{{ row.type }}</td>
          <td class="px-4 py-3 font-mono text-xs text-zinc-600">{{ row.default }}</td>
          <td class="px-4 py-3 text-xs text-zinc-600">{{ row.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>

<ng-content />
