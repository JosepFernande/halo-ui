<section id="playground" class="mb-14 scroll-mt-6">
  <h2 class="mb-6 text-2xl font-bold text-zinc-900">Playground interactivo</h2>

  <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_18rem]">
    <div class="rounded-2xl border border-surface-border bg-white shadow-sm">
      <div class="flex items-center gap-1 border-b border-surface-border p-2">
        <button
          type="button"
          class="rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors"
          [class]="activeTab() === 'preview' ? 'bg-surface-base text-brand-700' : 'text-zinc-500 hover:text-zinc-700'"
          (click)="selectTab('preview')"
        >
          Vista previa
        </button>
        <button
          type="button"
          class="rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors"
          [class]="activeTab() === 'code' ? 'bg-surface-base text-brand-700' : 'text-zinc-500 hover:text-zinc-700'"
          (click)="selectTab('code')"
        >
          Código
        </button>
      </div>

      <div class="p-8">
        @if (activeTab() === 'preview') {
          <ng-content select="[preview]" />
        } @else {
          <app-code-block label="Resultado" language="html" [code]="code()" />
        }
      </div>
    </div>

    <div class="flex flex-col gap-5 rounded-2xl border border-surface-border bg-white p-5 shadow-sm">
      <ng-content select="[controls]" />
    </div>
  </div>

  <ng-content />
</section>
